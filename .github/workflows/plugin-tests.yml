name: plugin tests

on:
  push:
    paths: ["plugin/**", ".github/workflows/plugin-tests.yml"]
  pull_request:
    paths: ["plugin/**", ".github/workflows/plugin-tests.yml"]

jobs:
  dsp-core:
    name: C++ DSP core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run behavioural tests
        working-directory: plugin/cpp
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I. test/test_cvrider.cpp -o test_cvrider
          ./test_cvrider
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I. test/test_phonemes.cpp -o test_phonemes
          ./test_phonemes

  web:
    name: AudioWorklet offline-render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run offline-render tests
        run: node plugin/web/test/run.mjs
      - name: Run browser UI smoke test
        run: node plugin/web/test/ui.mjs

  juce:
    name: JUCE build (Linux VST3 + Standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libcurl4-openssl-dev
      - name: Configure (fetches JUCE 8.0.4)
        working-directory: plugin/juce
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: plugin/juce
        run: cmake --build build --config Release -j"$(nproc)"
      - name: Check artefacts exist
        run: |
          test -f "plugin/juce/build/CVRider_artefacts/Release/VST3/CV Rider.vst3/Contents/x86_64-linux/CV Rider.so"
          test -f "plugin/juce/build/CVRider_artefacts/Release/Standalone/CV Rider"
      - name: pluginval (VST3, strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          sudo apt-get install -y xvfb
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            "plugin/juce/build/CVRider_artefacts/Release/VST3/CV Rider.vst3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs-linux
          path: pluginval-logs
          if-no-files-found: ignore

  macos:
    name: macOS build (AU + VST3 universal) + auval + pluginval
    runs-on: macos-latest
    permissions:
      contents: write   # to publish the rolling pre-release
    steps:
      - uses: actions/checkout@v4
      - name: Configure (fetches JUCE 8.0.4)
        working-directory: plugin/juce
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        working-directory: plugin/juce
        run: cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"
      - name: Ad-hoc sign and check architectures
        working-directory: plugin/juce/build/CVRider_artefacts/Release
        run: |
          for b in "AU/CV Rider.component" "VST3/CV Rider.vst3" "Standalone/CV Rider.app"; do
            codesign --force --deep --sign - "$b"
          done
          lipo -info "VST3/CV Rider.vst3/Contents/MacOS/CV Rider"
          lipo -info "AU/CV Rider.component/Contents/MacOS/CV Rider"
      - name: Install AU and run auval
        working-directory: plugin/juce/build/CVRider_artefacts/Release
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R "AU/CV Rider.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "VST3/CV Rider.vst3" ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Cvrd AtoZ
      - name: pluginval (AU + VST3, strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            "$HOME/Library/Audio/Plug-Ins/VST3/CV Rider.vst3"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            "$HOME/Library/Audio/Plug-Ins/Components/CV Rider.component"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs-macos
          path: pluginval-logs
          if-no-files-found: ignore
      - name: Package bundles (ditto keeps executable bits, symlinks and signatures)
        working-directory: plugin/juce
        run: |
          rm -rf dist && mkdir -p dist/cvrider-macos
          cp -R "build/CVRider_artefacts/Release/AU/CV Rider.component" \
                "build/CVRider_artefacts/Release/VST3/CV Rider.vst3" \
                "build/CVRider_artefacts/Release/Standalone/CV Rider.app" dist/cvrider-macos/
          cp install-mac.sh "Install CV Rider.command" ../docs/README-INSTALL.txt dist/cvrider-macos/
          chmod +x dist/cvrider-macos/install-mac.sh "dist/cvrider-macos/Install CV Rider.command"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent cvrider-macos cvrider-macos.zip)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cvrider-macos
          path: plugin/juce/dist/cvrider-macos.zip
      - name: Publish rolling pre-release "cvrider-latest" (push events only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: plugin/juce/dist
        run: |
          TAG=cvrider-latest
          NOTES="CV Rider — 最新ビルド（ブランチ: ${GITHUB_REF_NAME}、コミット: ${GITHUB_SHA::7}、$(date -u +%Y-%m-%d\ %H:%M) UTC）。

          cvrider-macos.zip をダウンロード → ダブルクリックで展開 → 中の「Install CV Rider.command」をダブルクリック。
          詳しい手順: plugin/docs/logic-setup.md"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" cvrider-macos.zip --prerelease --target "$GITHUB_SHA" \
            --title "CV Rider 最新ビルド (macOS AU/VST3)" --notes "$NOTES"
