[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchtrace"
version = "0.2.0"
description = "生楽器のピッチ挙動（イントネーション・ポルタメント・ビブラート等）を学習し、MIDI に適用するツール"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mido>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]
live = ["python-rtmidi>=1.5"]
analysis = ["librosa>=0.10"]
viz = ["matplotlib>=3.7"]

[project.scripts]
pitchtrace = "pitchtrace.cli:main"

[tool.setuptools.packages.find]
include = ["pitchtrace*"]

[tool.setuptools.package-data]
pitchtrace = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
